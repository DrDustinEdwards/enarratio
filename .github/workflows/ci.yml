name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels its older run; a push to the default branch never does.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # The Node.js lines the README says CI tests: 24, which consumers run, and 26, the .nvmrc line.
    # The tooling jobs read the version from .nvmrc.
    name: Typecheck, lint, unit and render tests, package (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Fails if core gains a runtime dependency; reports each entry's gzipped size.
      - run: npm run size
      # devkit's no-bloat report (knip and jscpd against .no-bloat.json's baseline): a warning, never a failure.
      - run: npm run bloat
      - run: npm pack --dry-run

  browser:
    name: Accessibility, interaction and visual tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run gallery
      # Ubuntu 24.04 runners forbid unprivileged user namespaces through AppArmor, and Chrome's
      # sandbox needs them. Lifting that restriction on the throwaway runner keeps the sandbox on,
      # so the tests run Chrome as readers do; --no-sandbox would test a weaker browser instead.
      - name: Allow Chrome's sandbox
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      - run: npm run test:browser
      # A failed visual run keeps its diffs, and the images it wrote for examples that had none,
      # so a maintainer can review them and commit the ones that are right.
      - name: Keep visual output from a failed run
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-output
          path: |
            test/browser/__output__/
            test/browser/__snapshots__/linux/
          if-no-files-found: ignore

  # The gallery at https://enarratio.dustinedwards.info, through devkit's shared deploy (worker-deploy.yml), as on the D1
  # sites: once the checks pass it builds the package and the gallery, deploys with DEPLOY_SHA set to this commit, waits
  # for /health (site-runtime's staticSite) to report it, checks the home page answers, and rolls the deploy back if it
  # does not.
  deploy:
    needs: [check, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy
      cancel-in-progress: false
    uses: DrDustinEdwards/devkit/.github/workflows/worker-deploy.yml@e7ecda8f69c8bbde738edcd1cf510710e547bcf3 # v0.20.22
    with:
      worker-name: enarratio
      health-url: https://enarratio.dustinedwards.info/health
      verify-command: >-
        code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://enarratio.dustinedwards.info/ || true);
        echo "home page answered $code";
        if [ "$code" = 200 ]; then exit 0; elif [ "$code" = 000 ]; then exit 3; else exit 1; fi
      install: PUPPETEER_SKIP_DOWNLOAD=true npm ci
      pre-deploy: npm run build && npm run gallery
      sha-var: DEPLOY_SHA
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Prelum's prelum-indexnow with the live sitemap and the key in scripts/gallery.ts, once the live gate passes. A
  # refused ping is a warning, never a failed deploy.
  indexnow:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - name: Tell IndexNow
        run: |
          key=$(sed -n 's/^const INDEXNOW_KEY = "\(.*\)";$/\1/p' scripts/gallery.ts)
          curl -sf https://enarratio.dustinedwards.info/sitemap.xml -o "$RUNNER_TEMP/sitemap.xml"
          npx prelum-indexnow --origin https://enarratio.dustinedwards.info --key "$key" --sitemap "$RUNNER_TEMP/sitemap.xml"
