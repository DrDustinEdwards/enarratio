name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Every Node.js line the README promises (A16).
    name: Typecheck, lint, unit and render tests, package (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run

  browser:
    name: Accessibility, interaction and visual tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run gallery
      # Ubuntu 24.04 runners forbid unprivileged user namespaces through AppArmor, and Chrome's
      # sandbox needs them. Lifting that restriction on the throwaway runner keeps the sandbox on,
      # so the tests run Chrome as readers do; --no-sandbox would test a weaker browser instead.
      - name: Allow Chrome's sandbox
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      - run: npm run test:browser
      # A failed visual run keeps its diffs, and the images it wrote for examples that had none,
      # so a maintainer can review them and commit the ones that are right.
      - name: Keep visual output from a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-output
          path: |
            test/browser/__output__/
            test/browser/__snapshots__/linux/
          if-no-files-found: ignore
