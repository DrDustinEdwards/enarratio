name: Visual snapshots

# Renders the gallery on the CI platform and publishes the images, for a maintainer to review and
# commit when a chart's appearance changes on purpose. It never commits to the branch it ran on:
# the images go to a separate branch, visual-snapshots/<branch>, which holds only them, and are
# also uploaded as an artifact. Copy the ones you accept into test/browser/__snapshots__/linux/.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run gallery
      # Ubuntu 24.04 runners forbid unprivileged user namespaces through AppArmor, and Chrome's
      # sandbox needs them. Lifting that restriction on the throwaway runner keeps the sandbox on,
      # so the tests run Chrome as readers do; --no-sandbox would test a weaker browser instead.
      - name: Allow Chrome's sandbox
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      - run: npx vitest run --config vitest.browser.config.ts test/browser/visual.test.ts
        env:
          UPDATE_SNAPSHOTS: "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-snapshots-linux
          path: test/browser/__snapshots__/linux/
      # A branch of its own, so the images can be fetched with git without a login. Force-pushed:
      # it is only ever the latest render.
      - name: Publish the images to visual-snapshots/<branch>
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan visual-snapshots
          git rm -rf --cached . > /dev/null
          git add -f test/browser/__snapshots__/linux
          git commit -q -m "Linux visual snapshots rendered from ${GITHUB_SHA}"
          git push --force origin "HEAD:refs/heads/visual-snapshots/${GITHUB_REF_NAME//\//-}"
