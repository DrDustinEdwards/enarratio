name: worker-size

# The gallery Worker's bundle budget (.worker-size.json, about 10% over its size on 2026-10-24): devkit's shared
# check, a `wrangler deploy --dry-run` that needs no Cloudflare secret. The gallery is built first because wrangler
# reads the assets directory.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  worker-size:
    uses: DrDustinEdwards/devkit/.github/workflows/worker-size.yml@505cda4815ae1e0dfcd318c48b287238108e1a30 # v0.12.0
    with:
      install: PUPPETEER_SKIP_DOWNLOAD=true npm ci
      prepare: npm run build && npm run gallery
