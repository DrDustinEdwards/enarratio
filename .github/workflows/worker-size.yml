name: worker-size

# The gallery Worker's bundle budget (.worker-size.json, about 10% over its size on 2026-10-24): devkit's shared
# check, a `wrangler deploy --dry-run` that needs no Cloudflare secret. The gallery is built first because wrangler
# reads the assets directory.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels its older run; a push to the default branch never does.
concurrency:
  group: worker-size-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  worker-size:
    uses: DrDustinEdwards/devkit/.github/workflows/worker-size.yml@4d0c8fdb2f1794272b31d3c4354059eb2f19a26a # v0.22.0
    with:
      install: PUPPETEER_SKIP_DOWNLOAD=true npm ci
      prepare: npm run build && npm run gallery
