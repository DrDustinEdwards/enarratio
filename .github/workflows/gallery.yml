name: Deploy gallery

# Publishes the gallery to https://enarratio.dustinedwards.info when main changes. It needs two
# repository secrets, CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; without them it says so and
# stops, rather than failing every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gallery-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare credentials
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=Gallery not deployed::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy the gallery."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - if: steps.secrets.outputs.ready == 'true'
        run: npm run deploy:gallery
      # Prelum's prelum-indexnow with the built sitemap and the key in scripts/gallery.ts. A refused ping is a
      # warning, never a failed deploy.
      - if: steps.secrets.outputs.ready == 'true'
        name: Tell IndexNow
        run: |
          key=$(sed -n 's/^const INDEXNOW_KEY = "\(.*\)";$/\1/p' scripts/gallery.ts)
          npx prelum-indexnow --origin https://enarratio.dustinedwards.info --key "$key" --sitemap site/dist/sitemap.xml
