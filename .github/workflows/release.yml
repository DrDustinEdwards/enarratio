name: Release

# A release is the merge of its version bump. When package.json's version on main has no v<version>
# tag yet, the tag job tags that commit and publishes a GitHub release with the version's CHANGELOG
# section, and the stage job then stages it on npm. A v* tag pushed by hand still stages too. Run it
# by hand (Actions > Release > Run workflow) for a version that merged untagged.
#
# The stage job stays in this file rather than following its own tag: a tag made with the
# workflow's token starts no other workflow (GitHub's rule against loops), and npm accepts the
# publish only from this file.
#
# Stages a release on npm. Nothing goes live here: the workflow runs
# `npm stage publish`, and the version stays hidden until a maintainer approves it with 2FA on
# npmjs.com (Staged Packages tab) or with `npm stage approve`. Steps for a release: docs/releasing.md.
#
# Authentication is npm trusted publishing (OIDC): no npm token is stored anywhere. npm accepts the
# publish only from this file, by name, as configured on the package's npm settings page, so renaming
# this file breaks releases until that setting is changed too. Provenance is generated
# automatically for a trusted publish from a public repository; it is also set explicitly below.
# npm's documentation: https://docs.npmjs.com/trusted-publishers and
# https://docs.npmjs.com/staged-publishing (npm CLI 11.15.0 or later, Node.js 22.14.0 or later).

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions: {}

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag and publish the release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      created: ${{ steps.release.outputs.created }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists; nothing to release."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The version's own CHANGELOG section, from its heading to the next one.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section headed ## [$version]. Add it before bumping the version."
            exit 1
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
          echo "created=true" >> "$GITHUB_OUTPUT"

  stage:
    name: Stage the release on npm
    needs: tag
    # A hand-pushed tag (the tag job skipped), or a tag the tag job just made.
    if: ${{ !cancelled() && (github.ref_type == 'tag' || needs.tag.outputs.created == 'true') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Lets the job request the OIDC token that npm exchanges for a short-lived publish token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # No dependency cache in a release build (npm's trusted publishing guide).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Install the npm CLI that supports staged publishing
        run: npm install --global npm@11.21.0
      - name: Check the tag matches package.json and is on main
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || needs.tag.outputs.tag }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version (expected v$version)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG points at a commit that is not on main. Tag a commit on main."
            exit 1
          fi
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run size
      - name: Stage on npm
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          # The dist-tag is fixed once staged, so it is passed explicitly from publishConfig.
          tag="$(node -p 'require("./package.json").publishConfig.tag')"
          npm stage publish --tag "$tag"
      - name: Say what to do next
        run: |
          {
            echo "### Staged on npm, not yet live"
            echo
            echo "Sign in at https://www.npmjs.com, open the Staged Packages tab and approve it, or run"
            echo "\`npm stage list enarratio\` and \`npm stage approve <stage-id>\`. Steps: docs/releasing.md."
          } >> "$GITHUB_STEP_SUMMARY"
